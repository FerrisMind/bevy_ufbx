[package]
name = "bevy_ufbx"
version = "0.19.0"
edition = "2024"
authors = ["Artur <arturmisiurev@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/FizzWizzleDazzle/bevy_ufbx"
description = "FBX asset loader for Bevy using the ufbx library"
keywords = ["bevy", "fbx", "asset", "loader"]
categories = ["game-development", "graphics"]

[features]
default = ["animation"]
animation = ["bevy/bevy_animation", "bevy/morph_animation"]

[dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_pbr",
    "bevy_scene",
    "bevy_world_serialization",
    "png",
    "jpeg",
]}
ufbx = "0.9"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
bevy = { version = "0.19", default-features = true }
serde_json = "1.0.145"
ufbx = "0.9"
